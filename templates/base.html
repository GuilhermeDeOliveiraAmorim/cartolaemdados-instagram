<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Archivo"; src: url("{{ FONTES }}/Archivo.ttf"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Source Serif 4"; src: url("{{ FONTES }}/SourceSerif4.ttf"); font-weight: 200 900; }
@font-face { font-family: "Plex Mono"; src: url("{{ FONTES }}/IBMPlexMono-Regular.ttf"); font-weight: 400; }
@font-face { font-family: "Plex Mono"; src: url("{{ FONTES }}/IBMPlexMono-Medium.ttf"); font-weight: 500; }
@font-face { font-family: "Plex Mono"; src: url("{{ FONTES }}/IBMPlexMono-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: "Plex Mono"; src: url("{{ FONTES }}/IBMPlexMono-Bold.ttf"); font-weight: 700; }
:root {
  --papel: #F3F5F1; --papel2: #E8ECE5; --grade: rgba(30,58,46,.07);
  --tinta: #14231C; --tinta2: #3D5248; --tinta3: #5E6F66; --linha: #C9D2CA;
  --previsto: #2546A8; --gramado: #1F7A3A; --marca: #F2D43A; --marca-fundo: rgba(242,212,58,.55); --erro: #B4332A;
  --f-titulo: "Archivo", "Arial Narrow", sans-serif; --f-texto: "Source Serif 4", Georgia, serif; --f-dado: "Plex Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; }
body {
  background-color: var(--papel); color: var(--tinta); font-family: var(--f-texto);
  background-image: linear-gradient(var(--grade) 1px, transparent 1px), linear-gradient(90deg, var(--grade) 1px, transparent 1px);
  background-size: 24px 24px; background-position: -1px -1px;
  -webkit-font-smoothing: antialiased;
}
.slide { position: absolute; inset: 0; padding: 72px 72px 64px; display: flex; flex-direction: column; }
.topo { display: flex; justify-content: space-between; align-items: baseline; font: 500 22px/1 var(--f-dado); letter-spacing: .08em; text-transform: uppercase; color: var(--tinta2); padding-bottom: 20px; border-bottom: 2px solid var(--tinta); }
.topo b { color: var(--tinta); font-weight: 700; }
.corpo { flex: 1; display: flex; flex-direction: column; padding-top: 48px; min-height: 0; }
.rodape { display: flex; justify-content: space-between; align-items: baseline; font: 500 22px/1 var(--f-dado); color: var(--tinta3); padding-top: 20px; border-top: 1px solid var(--linha); }
.rodape .site { color: var(--tinta); font-weight: 600; }
.chapeu { font: 600 26px/1 var(--f-dado); letter-spacing: .1em; text-transform: uppercase; color: var(--tinta2); margin-bottom: 20px; }
h1 { font: 800 112px/0.94 var(--f-titulo); font-stretch: 75%; letter-spacing: -.01em; text-transform: uppercase; }
h2 { font: 800 76px/0.98 var(--f-titulo); font-stretch: 75%; text-transform: uppercase; letter-spacing: -.005em; }
.marca { background: linear-gradient(transparent 12%, var(--marca-fundo) 12%, var(--marca-fundo) 92%, transparent 92%); padding: 0 .08em; }
.previsto { color: var(--previsto); }
.dado { font-family: var(--f-dado); }
.lead { font: 400 36px/1.35 var(--f-texto); color: var(--tinta2); max-width: 26ch; }
.nota { font: italic 400 26px/1.4 var(--f-texto); color: var(--tinta3); }
.etiqueta { font: 600 20px/1 var(--f-dado); letter-spacing: .08em; text-transform: uppercase; color: var(--tinta3); }
.cap { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; background: var(--marca); color: var(--tinta); font: 700 22px/1 var(--f-dado); border: 2px solid var(--tinta); }
.legenda-graf { display: flex; gap: 36px; font: 500 22px/1 var(--f-dado); color: var(--tinta2); align-items: center; }
.legenda-graf i { display: inline-block; vertical-align: middle; margin-right: 10px; }
.bola-prev { width: 22px; height: 22px; border-radius: 50%; border: 4px solid var(--previsto); background: var(--papel); }
.bola-real { width: 22px; height: 22px; border-radius: 50%; background: var(--tinta); }
{% block estilo %}{% endblock %}
</style>
</head>
<body>
<div class="slide">
  <header class="topo"><span><b>Cartola em Dados</b></span><span>{% block topo_dir %}Rodada {{ rodada }} · {{ temporada }}{% endblock %}</span></header>
  <main class="corpo">{% block corpo %}{% endblock %}</main>
  <footer class="rodape"><span class="site">{{ DOMINIO }}</span><span>{% block rodape_dir %}{% if pagina %}{{ pagina }}/{{ paginas }}{% if pagina < paginas %} &nbsp;arraste →{% endif %}{% endif %}{% endblock %}</span></footer>
</div>
</body>
</html>
