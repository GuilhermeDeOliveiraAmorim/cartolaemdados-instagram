name: Métricas

# Coleta as métricas dos posts e da conta e regrava metricas/RELATORIO.md.
on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 em Brasília
  workflow_dispatch:

concurrency:
  group: metricas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metricas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      - run: python metricas.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_LOGIN: ${{ vars.IG_LOGIN || 'unificado' }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metricas
          if ! git diff --cached --quiet; then
            git commit -m "chore(metricas): coleta de $(date -u +%F)"
            git pull --rebase
            git push
          fi
